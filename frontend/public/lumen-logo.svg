<svg width="200" height="48" viewBox="0 0 200 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Mark: aperture / light source — a ring of light reading the market -->
  <g>
    <circle cx="24" cy="24" r="14" stroke="#3B5BDB" stroke-width="3"/>
    <circle cx="24" cy="24" r="4.5" fill="#3B5BDB"/>
    <!-- candle ticks radiating, suggesting data being read -->
    <rect x="23" y="2" width="2" height="6" rx="1" fill="#3B5BDB"/>
    <rect x="23" y="40" width="2" height="6" rx="1" fill="#3B5BDB"/>
    <rect x="40" y="23" width="6" height="2" rx="1" fill="#3B5BDB"/>
    <rect x="2" y="23" width="6" height="2" rx="1" fill="#3B5BDB"/>
  </g>
  <!-- Wordmark -->
  <text x="56" y="32" font-family="'Sohne','Inter',sans-serif" font-size="26" font-weight="600" letter-spacing="-0.5" fill="#0F172A">Lumen</text>
</svg>
